apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  namespace: taskforge
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: taskforge-auth-service:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: taskforge-config
                  key: AUTH_DATABASE_URL
---
apiVersion: batch/v1
kind: Job
metadata:
  name: task-migrate
  namespace: taskforge
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: taskforge-task-service:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: taskforge-config
                  key: TASK_DATABASE_URL
