apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: taskforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: taskforge-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: taskforge-config
                  key: AUTH_DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: taskforge-secrets
                  key: JWT_SECRET_KEY
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: taskforge-config
                  key: DEBUG
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: taskforge
spec:
  selector:
    app: auth
  ports:
    - port: 8000
      targetPort: 8000
