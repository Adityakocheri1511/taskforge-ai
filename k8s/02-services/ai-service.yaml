apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache-pvc
  namespace: taskforge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: taskforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      containers:
        - name: ai
          image: taskforge-ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: QDRANT_URL
              valueFrom:
                configMapKeyRef:
                  name: taskforge-config
                  key: QDRANT_URL
            - name: KAFKA_BOOTSTRAP
              valueFrom:
                configMapKeyRef:
                  name: taskforge-config
                  key: KAFKA_BOOTSTRAP
          volumeMounts:
            - name: model-cache
              mountPath: /home/app/.cache
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 15
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: taskforge
spec:
  selector:
    app: ai
  ports:
    - port: 8000
      targetPort: 8000
