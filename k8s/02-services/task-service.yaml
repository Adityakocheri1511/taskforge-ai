apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: taskforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task
  template:
    metadata:
      labels:
        app: task
    spec:
      containers:
        - name: task
          image: taskforge-task-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: taskforge-config
                  key: TASK_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: taskforge-config
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: taskforge-config
                  key: RABBITMQ_URL
            - name: KAFKA_BOOTSTRAP
              valueFrom:
                configMapKeyRef:
                  name: taskforge-config
                  key: KAFKA_BOOTSTRAP
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: taskforge-secrets
                  key: JWT_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: taskforge
spec:
  selector:
    app: task
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  namespace: taskforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outbox-relay
  template:
    metadata:
      labels:
        app: outbox-relay
    spec:
      containers:
        - name: outbox-relay
          image: taskforge-task-service:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.outbox_relay"]
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: taskforge-config
                  key: TASK_DATABASE_URL
            - name: KAFKA_BOOTSTRAP
              valueFrom:
                configMapKeyRef:
                  name: taskforge-config
                  key: KAFKA_BOOTSTRAP
