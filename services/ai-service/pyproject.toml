[project]
name = "ai-service"
version = "0.1.0"
description = "TaskForge.AI AI Service - semantic search over tasks"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "qdrant-client>=1.9.0",
    "fastembed>=0.3.0",
    "aiokafka>=0.10.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.2.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]